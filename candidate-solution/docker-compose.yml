services:
  # ============================================================================
  # 1. PostgreSQL Database (Pre-configured Medallion Schema)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: gen-ai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gen_ai_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_user} -d ${POSTGRES_DB:-gen_ai_agent_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gen-ai-network

  # ============================================================================
  # 2. Location Service (Provided REST API)
  # ============================================================================
  location-service:
    build:
      context: ..
      dockerfile: Dockerfile.location-service
    container_name: gen-ai-location-service
    environment:
      LOCATION_SERVICE_PORT: ${LOCATION_SERVICE_PORT:-8001}
    ports:
      - "${LOCATION_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gen-ai-network

  # ============================================================================
  # 3. FastMCP / MCPServer (Candidate Solution)
  # ============================================================================
  mcp-server:
    build:
      context: ..
      dockerfile: candidate-solution/Dockerfile.mcp
    container_name: gen-ai-mcp-server
    environment:
      LOCATION_SERVICE_HOST: location-service
      LOCATION_SERVICE_PORT: 8001
      LOCATION_SERVICE_URL: http://location-service:8001
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: ${MCP_SERVER_PORT:-8003}
    ports:
      - "${MCP_SERVER_PORT:-8003}:8003"
    depends_on:
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gen-ai-network

  # ============================================================================
  # 4. Agent Analyzer Service (Candidate Solution)
  # ============================================================================
  agent:
    build:
      context: ..
      dockerfile: candidate-solution/Dockerfile.agent
    container_name: gen-ai-agent
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: ${AGENT_PORT:-8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gen_ai_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      MCP_SERVER_HOST: mcp-server
      MCP_SERVER_PORT: 8003
      MCP_SERVER_URL: http://mcp-server:8003
      LOCATION_SERVICE_URL: http://location-service:8001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    env_file:
      - .env
    ports:
      - "${AGENT_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gen-ai-network

  # ============================================================================
  # 5. Transaction Service (Provided Transaction Generator)
  # ============================================================================
  transaction-service:
    build:
      context: ..
      dockerfile: Dockerfile.transaction-service
    container_name: gen-ai-transaction-service
    environment:
      TRANSACTION_SERVICE_PORT: ${TRANSACTION_SERVICE_PORT:-8002}
      AGENT_ENDPOINT: http://agent:8000/transactions
      TRANSACTION_SERVICE_INTERVAL: ${TRANSACTION_SERVICE_INTERVAL:-5}
    ports:
      - "${TRANSACTION_SERVICE_PORT:-8002}:8002"
    depends_on:
      location-service:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gen-ai-network

  # ============================================================================
  # 6. Medallion ETL Pipeline (Candidate Solution)
  # ============================================================================
  pipeline:
    build:
      context: ..
      dockerfile: candidate-solution/Dockerfile.pipeline
    container_name: gen-ai-pipeline
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gen_ai_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
      ETL_INTERVAL_SECONDS: ${ETL_INTERVAL_SECONDS:-10}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gen-ai-network

  # ============================================================================
  # 7. Streamlit Dashboard (Candidate Solution)
  # ============================================================================
  dashboard:
    build:
      context: ..
      dockerfile: candidate-solution/Dockerfile.dashboard
    container_name: gen-ai-dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-gen_ai_agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_password}
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gen-ai-network

volumes:
  postgres_data:
    driver: local

networks:
  gen-ai-network:
    driver: bridge
